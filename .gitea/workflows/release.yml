# Tag release: musl-static binaries for x86_64 + aarch64, published to Gitea.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  releases: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: ./scripts/ci-ensure-host-deps.sh base

      - name: Build and package release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release-build.sh

      - name: Publish Gitea release
        env:
          GITEA_URL: ${{ vars.RELEASE_TARGET_URL }}
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/gitea-release-publish.sh