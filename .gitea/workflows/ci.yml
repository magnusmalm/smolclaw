name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        profile: [full, minimal]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ./scripts/ci-ensure-host-deps.sh ${{ matrix.compiler }}

      - name: Configure (minimal)
        if: matrix.profile == 'minimal'
        run: |
          cp configs/defconfig.minimal .config
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Configure (full)
        if: matrix.profile == 'full'
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: |
          if [ "${{ matrix.profile }}" = "minimal" ]; then
            ctest --test-dir build --output-on-failure -LE security
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Binary info
        run: |
          ls -lh build/smolclaw
          file build/smolclaw
          ./build/smolclaw version

  size-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ./scripts/ci-ensure-host-deps.sh base

      - name: Build minimal (MinSizeRel + gc-sections)
        run: |
          cp configs/defconfig.minimal .config
          cmake -B build-size \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections"
          cmake --build build-size -j$(nproc) --target smolclaw

      - name: Check size budget
        run: ./scripts/check_size_budget.sh build-size/smolclaw 320 minimal-dynamic