name: Release

# On a v* tag: build + push a multi-arch container image to ghcr.io and create
# a GitHub Release.
#
# NOTE: standalone static binaries are intentionally not built here yet — the
# fully-static musl link in Alpine needs more work (curl's transitive static
# deps). Tracked as a follow-up. The Gitea release pipeline still produces the
# musl-static tarballs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

jobs:
  # ---- Multi-arch container image to ghcr.io --------------------------------
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  # ---- GitHub Release -------------------------------------------------------
  release:
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Multi-arch container image:
            `docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            (Standalone static binaries are produced by the Gitea release
            pipeline; a GitHub binary build is a planned follow-up.)
