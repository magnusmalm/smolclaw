name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential python3-pip \
            libcurl4-openssl-dev libevent-dev libssl-dev \
            libreadline-dev libsqlite3-dev
          pip3 install kconfiglib

      - name: Install QEMU for cross-arch testing
        if: matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Cache musl toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: deps/musl-toolchain-${{ matrix.arch }}
          key: musl-toolchain-${{ matrix.arch }}-${{ hashFiles('scripts/build_musl_deps.sh') }}

      - name: Cache musl static deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: deps/musl-static-${{ matrix.arch }}
          key: musl-static-${{ matrix.arch }}-${{ hashFiles('scripts/build_musl_deps.sh') }}

      - name: Build musl static deps
        run: ./scripts/build_musl_deps.sh ${{ matrix.arch }}

      - name: Configure
        run: |
          TOOLCHAIN="deps/musl-toolchain-${{ matrix.arch }}"
          TRIPLE=$(ls "$TOOLCHAIN/bin/" | head -1 | sed 's/-gcc$//')
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSC_MUSL_STATIC=ON \
            -DSC_STRIP=ON \
            -DCMAKE_C_COMPILER="$TOOLCHAIN/bin/${TRIPLE}-gcc" \
            -DCMAKE_PREFIX_PATH="$(pwd)/deps/musl-static-${{ matrix.arch }}"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test (native)
        if: matrix.arch == 'x86_64'
        run: ctest --test-dir build --output-on-failure

      - name: Binary info
        run: |
          ls -lh build/smolclaw
          file build/smolclaw

      - name: Package
        run: |
          ARTIFACT="smolclaw-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "$ARTIFACT"
          cp build/smolclaw "$ARTIFACT/"
          cp LICENSE README.md "$ARTIFACT/"
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smolclaw-${{ matrix.arch }}
          path: smolclaw-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            smolclaw-*.tar.gz
            smolclaw-*.tar.gz.sha256
